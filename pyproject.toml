[project]
name = "stock-analysis-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pytz",
    "requests",
    "yfinance",
    "FinMind",
    "rich",
    "loguru",
    "fastapi",
    "uvicorn",
    "python-multipart"
]

[tool.vercel]
entrypoint = "api.index:app"
memory = 1024
maxDuration = 10
include_files = ["src/cache/**"]
